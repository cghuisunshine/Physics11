<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490"
 viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">Convex: reflected rays appear to come from F</title><desc id="desc">Light arrives from the left, parallel to the principal axis. Orange arrows show incoming light; teal arrows show reflected light. The reflected rays spread apart in front of the mirror. Dashed backward extensions meet at the virtual focus F behind it. The order is V, F, C. F is halfway between V and C. The shaded area is behind the mirror.</desc>
<defs>
<marker id="incoming" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b24c20"/></marker>
<marker id="reflected" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#086b72"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#203440}
.title{font-size:27px;font-weight:700;fill:#075d64}
.small{font-size:18px}.label{font-size:23px;font-weight:700}
.axis{stroke:#879da4;stroke-width:1.5}.dimension{stroke:#647a84;stroke-width:1.5;fill:none}
.in{stroke:#b24c20;stroke-width:3;fill:none}
.out{stroke:#086b72;stroke-width:3;fill:none}
.extension{stroke:#086b72;stroke-width:2;stroke-dasharray:7 6;fill:none}
</style></defs>
<rect width="960" height="490" rx="12" fill="#fff"/>
<rect x="14" y="14" width="932" height="462" rx="12" fill="none" stroke="#cadbdd" stroke-width="2"/>
<text x="32" y="52" class="title">Convex: reflected rays appear to come from F</text>
<text x="32" y="86" class="small">Solid arrows: actual light</text>
<rect x="638" y="108" width="292" height="225" rx="8" fill="#eef3f4"/>
<text x="56" y="132">In front of mirror</text>
<text x="665" y="132">Behind mirror</text>
<path d="M48 230H932" class="axis"/>
<text x="55" y="258" class="small">Principal axis</text>
<path d="M65 182H603.620" class="in"/>
<path d="M220 182H330" class="in" marker-end="url(#incoming)"/>
<path d="M603.620 182L290 85.736" class="out"/>
<path d="M462.491 138.681L399.767 119.428" class="out" marker-end="url(#reflected)"/>
<path d="M603.620 182L760.0 230" class="extension"/>
<path d="M65 278H603.620" class="in"/>
<path d="M220 278H330" class="in" marker-end="url(#incoming)"/>
<path d="M603.620 278L290 374.264" class="out"/>
<path d="M462.491 321.319L399.767 340.572" class="out" marker-end="url(#reflected)"/>
<path d="M603.620 278L760.0 230" class="extension"/>
<path d="M617.717 125A320 320 0 0 0 617.717 335" fill="none" stroke="#075d64" stroke-width="7"/>
<circle cx="920" cy="230" r="5" fill="#203440"/>
<text x="920" y="259" text-anchor="middle" class="label">C</text>
<circle cx="760.0" cy="230" r="5" fill="#203440"/>
<text x="760.0" y="259" text-anchor="middle" class="label">F</text>
<circle cx="600" cy="230" r="5" fill="#203440"/>
<text x="613" y="259" text-anchor="middle" class="label">V</text>
<text x="672" y="305">Virtual focus</text>
<text x="654" y="352" class="small">Dashed: backward extensions</text>
<path d="M600 377V389M600 383H760.0M760.0 377V389" class="dimension"/>
<text x="680.0" y="373" text-anchor="middle" class="small">VF = |f|</text>
<path d="M600 419V431M600 425H920M920 419V431" class="dimension"/>
<text x="760.0" y="415" text-anchor="middle" class="small">VC = R</text>
<text x="32" y="459" class="small">Near-axis model: F is about halfway from V to C.</text>
</svg>
