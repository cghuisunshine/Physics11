<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">Parallel faces restore the direction, with a sideways shift</title><desc id="desc">A ray at 45 degrees in air bends to about 28.1 degrees in a glass slab of index 1.50. At its parallel second face it returns to 45 degrees in air. The emerging ray is parallel to a dashed straight continuation of the incoming ray, but displaced sideways. A short line marks the perpendicular gap.</desc>
<defs><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b24c20"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#086b72"/></marker>
