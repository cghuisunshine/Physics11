<svg xmlns="http://www.w3.org/2000/svg" width="960" height="454" viewBox="0 0 960 454" role="img" aria-labelledby="title desc">
<title id="title">Concave · Object at F</title><desc id="desc">Parallel reflected rays · No finite image. No finite screen position brings the image into focus. The object is a dark upright arrow. The image is a magenta arrow. Solid rays show actual light; dashed lines behind the mirror are backward extensions, not transmitted light.</desc>
