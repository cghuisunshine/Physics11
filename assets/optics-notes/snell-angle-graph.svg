   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203440" x="359.424" y="49.104" transform="rotate(-0 359.424 49.104)">n₁ = 1.00, n₂ = 1.50 · n₁ sin θ₁ = n₂ sin θ₂</text>
  </g>
  <g id="text_26">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203440" x="89.856" y="412.92" transform="rotate(-0 89.856 412.92)">The curve is below the equal-angle line: light bends toward the normal.</text>
  </g>
  <g id="text_27">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526875" x="89.856" y="435.24" transform="rotate(-0 89.856 435.24)">Model graph of angles, not the ray path. Both axes are measured from the normal.</text>
  </g>
 </g>
