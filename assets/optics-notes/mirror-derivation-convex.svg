<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">Convex: f &lt; 0, dᵢ &lt; 0, hᵢ &gt; 0</title>
<desc id="desc">Two rays from upright object tip O: an orange parallel ray reflects at P and a teal ray reflects at vertex V. Their reflected lines meet at image tip I, a virtual upright image behind, found with dashed backward extensions. Signed coordinate s increases toward the front, leftward. Vertical height is positive upward.</desc>
