<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" role="img" aria-labelledby="title desc">
<title id="title">Project both slits onto the midpoint direction MP</title>
<desc id="desc">Slits A and B have midpoint M. AP and BP meet at screen point P. AC and BD are perpendicular to MP, meeting it at C and D. D, M, C, P are collinear. MC and MD each equal half d sin theta, so CD equals d sin theta exactly. Actual paths AP and BP are slightly longer than projected lengths CP and DP.</desc>
<rect width="940" height="720" rx="12" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#182e3c">
<text x="28" y="36" font-size="23" font-weight="700">Project both slits onto MP</text>
<text x="28" y="66" font-size="16" fill="#526875">AC ⟂ MP and BD ⟂ MP · slit spacing enlarged for clarity</text>
<path d="M240 150V268M240 292V568M240 592V632M820 150V615" stroke="#526875" stroke-width="6"/>
<text x="785" y="131" font-size="17">Screen</text>
<path d="M240 430H902" stroke="#91a6b0" stroke-width="1.8" stroke-dasharray="7 6"/>
<text x="600" y="460" font-size="17" fill="#526875">Central normal MO</text>
<path d="M140 473.103 820.000 180.000" stroke="#526875" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M240.000 280.000 820.000 180.000M240.000 580.000 820.000 180.000" stroke="#086b72" stroke-width="3.5" fill="none"/>
<path d="M240.000 280.000 294.525 406.498M240.000 580.000 185.475 453.502" stroke="#087cff" stroke-width="3" fill="none"/>
<path d="M185.475 453.502 294.525 406.498" stroke="#bd4b24" stroke-width="6"/>
<path d="M288.983 393.641 301.840 388.100 307.381 400.956" fill="none" stroke="#087cff" stroke-width="2"/>
<path d="M191.017 466.359 203.873 460.817 198.332 447.961" fill="none" stroke="#087cff" stroke-width="2"/>
<path d="M290 430A50 50 0 0 0 285.916 410.209M240 330A50 50 0 0 0 259.791 325.916" fill="none" stroke="#526875" stroke-width="2"/>
<text x="325" y="423" font-size="21">θ</text><text x="270" y="332" font-size="21">θ</text>
<text transform="translate(500 216) rotate(-9.782)" font-size="22" fill="#086b72">AP</text>
<text transform="translate(500 424) rotate(-34.592)" font-size="22" fill="#086b72">BP</text>
<text transform="translate(508 294) rotate(-23.318)" font-size="20" fill="#526875">CP</text>
<text transform="translate(568 316) rotate(-23.318)" font-size="18" fill="#526875">DP = DC + CP</text>
<text x="282" y="355" font-size="18" fill="#087cff">AC</text><text x="139" y="550" font-size="18" fill="#087cff">BD</text>
<circle cx="240.000" cy="280.000" r="5" fill="#182e3c"/>
<circle cx="240.000" cy="580.000" r="5" fill="#182e3c"/>
<circle cx="240.000" cy="430.000" r="5" fill="#182e3c"/>
<circle cx="294.525" cy="406.498" r="5" fill="#182e3c"/>
<circle cx="185.475" cy="453.502" r="5" fill="#182e3c"/>
<circle cx="820.000" cy="180.000" r="5" fill="#182e3c"/>
<circle cx="820.000" cy="430.000" r="5" fill="#182e3c"/>
<text x="205" y="280" font-size="22" font-weight="700">A</text><text x="205" y="605" font-size="22" font-weight="700">B</text>
<text x="239" y="460" font-size="22" font-weight="700">M</text><text x="309" y="386" font-size="22" font-weight="700">C</text>
<text x="159.475" y="482.502" font-size="22" font-weight="700">D</text>
<text x="840" y="186" font-size="22" font-weight="700">P</text><text x="840" y="459" font-size="22" font-weight="700">O</text>
<path d="M110 280V580M103 280H117M103 580H117" stroke="#526875" stroke-width="2"/>
<text x="80" y="437" font-size="24">d</text>
<text x="400" y="553" font-size="25" font-weight="700" fill="#bd4b24">CD = d sin θ</text>
<text x="400" y="590" font-size="21">MC = MD = (d/2) sin θ</text>
<text x="28" y="671" font-size="17">C and D lie on MP, not on BP. M is the midpoint of the slits.</text>
<text x="28" y="703" font-size="17" fill="#526875">Distant P: AP ≈ CP, BP ≈ DP, so BP − AP ≈ DP − CP = CD.</text>
</g>
</svg>
