<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 535" role="img" aria-label="Moving source at two instants"><rect width="600" height="535" fill="white"/><g font-family="system-ui,sans-serif" font-size="19" fill="#182e3c"><text x="20" y="30" fill="#182e3c" text-anchor="start">A · First crest is emitted</text><path d="M40 90L560 90" stroke="#c5cdd1" stroke-width="2.5" fill="none" /><circle cx="270" cy="90" r="6" fill="#bd4b24"/><text x="270" y="70" fill="#182e3c" text-anchor="middle">Source + crest 1</text><text x="270" y="117" fill="#182e3c" text-anchor="middle">x = 0</text><text x="20" y="160" fill="#182e3c" text-anchor="start">B · One period later</text><path d="M40 300L560 300" stroke="#c5cdd1" stroke-width="2.5" fill="none" /><circle cx="270" cy="300" r="135" fill="none" stroke="#086b72" stroke-width="3"/><circle cx="270" cy="300" r="6" fill="#526875"/><circle cx="315" cy="300" r="6" fill="#bd4b24"/><circle cx="135" cy="300" r="6" fill="#086b72"/><circle cx="405" cy="300" r="6" fill="#086b72"/><text x="270" y="194" fill="#086b72" text-anchor="middle">Crest 1 (expanding circle)</text><text x="324" y="279" fill="#bd4b24" text-anchor="start">Crest 2</text><text x="135" y="327" fill="#182e3c" text-anchor="middle">−cTₛ</text><text x="270" y="327" fill="#182e3c" text-anchor="middle">0</text><text x="405" y="327" fill="#182e3c" text-anchor="middle">cTₛ</text><text x="320" y="352" fill="#bd4b24" text-anchor="middle">uₛTₛ</text><path d="M270 377L315 377" stroke="#bd4b24" stroke-width="2.5" fill="none" /><path d="M270 372L270 382" stroke="#bd4b24" stroke-width="2.5" fill="none" /><path d="M315 372L315 382" stroke="#bd4b24" stroke-width="2.5" fill="none" /><text x="292.5" y="368" fill="#bd4b24" text-anchor="middle"></text><path d="M270 411L405 411" stroke="#086b72" stroke-width="2.5" fill="none" /><path d="M270 406L270 416" stroke="#086b72" stroke-width="2.5" fill="none" /><path d="M405 406L405 416" stroke="#086b72" stroke-width="2.5" fill="none" /><text x="337.5" y="402" fill="#086b72" text-anchor="middle">cTₛ</text><path d="M135 465L315 465" stroke="#526875" stroke-width="2.5" fill="none" /><path d="M135 460L135 470" stroke="#526875" stroke-width="2.5" fill="none" /><path d="M315 460L315 470" stroke="#526875" stroke-width="2.5" fill="none" /><text x="225" y="456" fill="#526875" text-anchor="middle">λ behind</text><path d="M315 465L405 465" stroke="#bd4b24" stroke-width="2.5" fill="none" /><path d="M315 460L315 470" stroke="#bd4b24" stroke-width="2.5" fill="none" /><path d="M405 460L405 470" stroke="#bd4b24" stroke-width="2.5" fill="none" /><text x="360" y="456" fill="#bd4b24" text-anchor="middle">λ ahead</text><text x="300" y="510" fill="#182e3c" text-anchor="middle">Source moves right; crest 1 expands outward.</text></g></svg>