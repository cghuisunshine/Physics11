<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 365" role="img" aria-label="Moving observer meets consecutive crests"><rect width="600" height="365" fill="white"/><g font-family="system-ui,sans-serif" font-size="19" fill="#182e3c"><text x="20" y="30" fill="#182e3c" text-anchor="start">A · First crest meets observer</text><path d="M40 100L560 100" stroke="#c5cdd1" stroke-width="2.5" fill="none" /><path d="M110 72L110 128" stroke="#086b72" stroke-width="2.5" fill="none" /><path d="M470 72L470 128" stroke="#086b72" stroke-width="2.5" fill="none" /><circle cx="470" cy="100" r="6" fill="#bd4b24"/><text x="110" y="62" fill="#182e3c" text-anchor="middle">Crest 2</text><text x="470" y="62" fill="#182e3c" text-anchor="middle">Crest 1 + observer</text><path d="M110 151L470 151" stroke="#526875" stroke-width="2.5" fill="none" /><path d="M110 146L110 156" stroke="#526875" stroke-width="2.5" fill="none" /><path d="M470 146L470 156" stroke="#526875" stroke-width="2.5" fill="none" /><text x="290" y="142" fill="#526875" text-anchor="middle">λ₀</text><text x="20" y="205" fill="#182e3c" text-anchor="start">B · Next crest meets observer</text><path d="M40 260L560 260" stroke="#c5cdd1" stroke-width="2.5" fill="none" /><path d="M380 232L380 288" stroke="#086b72" stroke-width="2.5" fill="none" /><circle cx="380" cy="260" r="6" fill="#bd4b24"/><text x="380" y="222" fill="#182e3c" text-anchor="middle">Meeting point</text><path d="M110 260L380 260" stroke="#086b72" stroke-width="2.5" fill="none" /><path d="M470 260L380 260" stroke="#bd4b24" stroke-width="2.5" fill="none" /><path d="M110 310L380 310" stroke="#086b72" stroke-width="2.5" fill="none" /><path d="M110 305L110 315" stroke="#086b72" stroke-width="2.5" fill="none" /><path d="M380 305L380 315" stroke="#086b72" stroke-width="2.5" fill="none" /><text x="245" y="301" fill="#086b72" text-anchor="middle">cTₒ</text><path d="M380 310L470 310" stroke="#bd4b24" stroke-width="2.5" fill="none" /><path d="M380 305L380 315" stroke="#bd4b24" stroke-width="2.5" fill="none" /><path d="M470 305L470 315" stroke="#bd4b24" stroke-width="2.5" fill="none" /><text x="425" y="301" fill="#bd4b24" text-anchor="middle">uₒTₒ</text><text x="300" y="347" fill="#182e3c" text-anchor="middle">Together these distances close the original gap.</text></g></svg>