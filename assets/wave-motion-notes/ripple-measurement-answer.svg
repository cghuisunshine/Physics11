<text x="176.0" y="772" font-size="25" fill="#086b72" font-weight="650" text-anchor="middle">λ₂</text>
<text x="440" y="766" font-size="26" fill="#182e3c" font-weight="650" text-anchor="start">11 crests enclose 10 gaps.</text>
<text x="100" y="813" font-size="25" fill="#086b72" font-weight="700" text-anchor="start">λ₂ = v₁ / f₂ = (0.200 m/s) / (10.0 Hz) = 0.0200 m</text>
<text x="500" y="870" font-size="24" fill="#526875" font-weight="400" text-anchor="middle">Same speed + twice the frequency → half the wavelength.</text>
</g></svg>
