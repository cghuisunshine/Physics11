<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Worked answer: six lines, five gaps</title><desc id="desc">At 5.00 Hz, five gaps span 0.200 m, giving wavelength 0.0400 m and speed 0.200 m/s. At 10.0 Hz with unchanged speed, wavelength is 0.0200 m; ten gaps occupy the same span.</desc>
<defs><filter id="glow" x="-100%" width="300%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<rect width="1000" height="900" rx="16" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,sans-serif" fill="#182e3c">
<text x="60" y="56" font-size="32" fill="#182e3c" font-weight="750" text-anchor="start">Worked answer · Count gaps, then use v = fλ</text>
<text x="60" y="98" font-size="24" fill="#526875" font-weight="400" text-anchor="start">Both drawings use the same horizontal scale and tank span.</text>
<text x="60" y="145" font-size="27" fill="#182e3c" font-weight="700" text-anchor="start">Trial 1 · f₁ = 5.00 Hz</text>
<path d="M140 188V204M140 196H860M860 188V204" fill="none" stroke="#086b72" stroke-width="2.5"/>
<text x="500.0" y="181" font-size="25" fill="#086b72" font-weight="650" text-anchor="middle">0.200 m</text>
<rect x="100" y="220" width="800" height="125" rx="12" fill="#142c3c"/>
<path d="M140 232V333" stroke="#ffd481" stroke-width="11" opacity="0.5" filter="url(#glow)"/>
<path class="crest" d="M140 232V333" stroke="#fff2c6" stroke-width="4"/>
