<path class="crest" d="M572 232V333" stroke="#fff2c6" stroke-width="4"/>
<path d="M716 232V333" stroke="#ffd481" stroke-width="11" opacity="0.5" filter="url(#glow)"/>
<path class="crest" d="M716 232V333" stroke="#fff2c6" stroke-width="4"/>
<path d="M860 232V333" stroke="#ffd481" stroke-width="11" opacity="0.5" filter="url(#glow)"/>
<path class="crest" d="M860 232V333" stroke="#fff2c6" stroke-width="4"/>
<path d="M140 356V372M140 364H284M284 356V372" fill="none" stroke="#086b72" stroke-width="2.5"/>
<text x="212.0" y="397" font-size="25" fill="#086b72" font-weight="650" text-anchor="middle">λ₁</text>
<text x="440" y="390" font-size="26" fill="#182e3c" font-weight="650" text-anchor="start">6 crests enclose 5 gaps.</text>
<text x="100" y="434" font-size="27" fill="#086b72" font-weight="700" text-anchor="start">λ₁ = L / 5 = 0.200 m / 5 = 0.0400 m</text>
<text x="100" y="475" font-size="26" fill="#182e3c" font-weight="400" text-anchor="start">v₁ = f₁λ₁ = (5.00 Hz)(0.0400 m) = 0.200 m/s</text>
<path d="M60 497H940" stroke="#d6e2e5" stroke-width="2"/>
<text x="60" y="536" font-size="27" fill="#182e3c" font-weight="700" text-anchor="start">Trial 2 · f₂ = 10.0 Hz · constant-speed prediction</text>
