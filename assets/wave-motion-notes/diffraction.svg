<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title desc">
  <title id="title">Diffraction through narrow and wide openings</title>
  <desc id="desc">Two top views compare straight water-wave crests moving right toward a barrier. The incoming wavelength is the same in both views. An opening about one wavelength wide produces nearly semicircular outgoing crests with broad spreading. An opening five wavelengths wide produces mostly straight outgoing crests with curved edges. Crest spacing stays the same in the unchanged medium.</desc>
  <defs>
    <marker id="travel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526875"/></marker>
    <g id="incoming-crests" fill="none">
      <path d="M90 110V290M118 110V290M146 110V290M174 110V290" stroke="#086b72" stroke-width="3"/>
      <path d="M76 146H194" stroke="#526875" stroke-width="2" marker-end="url(#travel-arrow)"/>
      <path d="M118 294V304M146 294V304M118 299H146" stroke="#526875" stroke-width="1.5"/>
    </g>
  </defs>
  <rect width="600" height="740" fill="white"/>
  <g font-family="system-ui, sans-serif" font-size="19" fill="#18323f">
    <text x="24" y="28" font-size="17" fill="#526875">Top views · same incoming wavelength λ</text>
    <g id="narrow-opening">
      <text x="24" y="65" font-weight="600">A. Narrow opening: b ≈ λ</text>
      <text x="64" y="96" font-size="16" fill="#526875">Incoming</text>
      <use href="#incoming-crests"/>
      <text x="132" y="325" text-anchor="middle">λ</text>
      <path d="M221 104V186M221 214V300" stroke="#18323f" stroke-width="10"/>
      <path d="M196 186H207M196 214H207M201 186V214" stroke="#526875" stroke-width="1.5" fill="none"/>
      <text x="180" y="207">b</text>
      <g stroke="#086b72" stroke-width="3" fill="none">
        <path d="M226 172A28 28 0 0 1 226 228"/>
        <path d="M226 144A56 56 0 0 1 226 256"/>
        <path d="M226 116A84 84 0 0 1 226 284"/>
        <path d="M226 88A112 112 0 0 1 226 312"/>
      </g>
      <text x="389" y="190">Nearly circular</text>
      <text x="389" y="215">outgoing crests</text>
      <text x="300" y="340" text-anchor="middle" fill="#086b72">Narrow gap → broad spreading</text>
    </g>
    <path d="M24 363H576" stroke="#dce4e7"/>
    <g id="wide-opening" transform="translate(0 350)">
      <text x="24" y="65" font-weight="600">B. Wide opening: b = 5λ</text>
      <text x="64" y="96" font-size="16" fill="#526875">Incoming</text>
      <use href="#incoming-crests"/>
      <text x="132" y="325" text-anchor="middle">λ</text>
      <path d="M221 104V130M221 270V300" stroke="#18323f" stroke-width="10"/>
      <path d="M196 130H207M196 270H207M201 130V270" stroke="#526875" stroke-width="1.5" fill="none"/>
      <text x="180" y="207">b</text>
      <g stroke="#086b72" stroke-width="3" fill="none">
        <path d="M250.25 116A28 28 0 0 1 254 130V270A28 28 0 0 1 250.25 284"/>
        <path d="M274.5 102A56 56 0 0 1 282 130V270A56 56 0 0 1 274.5 298"/>
        <path d="M298.75 88A84 84 0 0 1 310 130V270A84 84 0 0 1 298.75 312"/>
        <path d="M323 74A112 112 0 0 1 338 130V270A112 112 0 0 1 323 326"/>
      </g>
      <text x="389" y="178">Mostly straight</text>
      <text x="389" y="203">outgoing crests;</text>
      <text x="389" y="228">edges curve</text>
      <text x="300" y="340" text-anchor="middle" fill="#086b72">Wide gap → less spreading</text>
    </g>
    <text x="300" y="725" text-anchor="middle" font-size="17" fill="#526875">Same medium → same crest spacing λ</text>
  </g>
</svg>
