<title id="title">Reflection stations · worked answer</title><desc id="desc">Three top-view ripple-tank diagrams: circular fronts at a flat barrier, a straight-front ray incident at 35 degrees to the normal, and straight fronts approaching a parabolic barrier along its axis. Reflected fronts and rays are orange; dashed extensions locate the virtual source. The reflected angle is 35 degrees and parallel incident rays reflect toward the focus.</desc>
