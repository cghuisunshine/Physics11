<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" role="img" aria-labelledby="title desc">
<title id="title">Right triangle for the Mach-cone half-angle</title>
<desc id="desc">At Mach 2 the source moves right from O to S through distance u_s delta t. An earlier disturbance centred at O has radius c delta t. The cone surface from S is tangent to that circle at A, perpendicular to radius OA. At S, the half-angle mu has opposite side OA and hypotenuse OS, so sin mu equals c divided by u_s.</desc>
<rect width="840" height="600" rx="12" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#182e3c">
<text x="28" y="36" font-size="22" font-weight="700">Mach-cone cross-section</text>
<text x="28" y="65" font-size="16" fill="#526875">Constant supersonic speed · shown at Mach 2</text>
<circle cx="270" cy="330" r="210" fill="#edf6f4" stroke="#086b72" stroke-width="2"/>
<path d="M280 93.3 690 330 280 566.7" stroke="#bd4b24" stroke-width="3" fill="none"/>
<path d="M270 330 375 148.135" stroke="#087cff" stroke-width="3"/>
<path d="M270 330H690" stroke="#526875" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M369 158.527 379.392 164.527 385.392 154.135" stroke="#087cff" stroke-width="2" fill="none"/>
<path d="M640 330A50 50 0 0 1 646.7 305" stroke="#bd4b24" stroke-width="2" fill="none"/>
<path d="M715 330H790m-14-8 14 8-14 8" fill="none" stroke="#182e3c" stroke-width="2.5"/>
<g fill="#182e3c"><circle cx="270" cy="330" r="5"/><circle cx="690" cy="330" r="5"/><circle cx="375" cy="148.135" r="5"/></g>
<text x="382" y="139" font-size="22" font-weight="700">A</text>
<text x="250" y="361" font-size="22" font-weight="700">O</text>
<text x="681" y="361" font-size="22" font-weight="700">S</text>
<text x="618" y="317" font-size="22" fill="#bd4b24">μ</text>
<text x="500" y="364" font-size="19">OS = u_s Δt</text>
<text x="159" y="206" font-size="19" fill="#087cff">OA = c Δt</text>
<text x="510" y="197" font-size="18" fill="#bd4b24">Cone surface</text>
<text x="112" y="434" font-size="16" fill="#086b72">Earlier sound front</text>
<text x="508" y="478" font-size="23" font-weight="700">sin μ = c/u_s = 1/M</text>
<text x="28" y="586" font-size="15" fill="#526875">O: earlier source position · S: current position · OA is perpendicular to SA</text>
</g>
</svg>
