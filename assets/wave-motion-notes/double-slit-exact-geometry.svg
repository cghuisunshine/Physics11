<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc">
<title id="title">Coordinate graph of the exact double-slit paths</title>
<desc id="desc">Slits A at zero, d over two and B at zero, minus d over two connect by nonparallel straight paths to P at L, y on a finite screen. The midpoint M is the origin and O is the screen centre at L, zero. AP is r_A, BP is r_B, and MP is R. Horizontal legs from both slits to the screen have length L. Their vertical legs to P have lengths absolute y minus d over two and absolute y plus d over two.</desc>
<rect width="900" height="690" rx="12" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#182e3c">
<text x="28" y="36" font-size="22" font-weight="700">Exact paths to a point on a finite screen</text>
<text x="28" y="66" font-size="16" fill="#526875">Coordinate geometry · schematic, with slit spacing enlarged</text>
<!-- M=(200,420), A=(200,320), B=(200,520), P=(680,160). -->
<path d="M200 570V112m-7 14 7-14 7 14M200 420H738m-14-7 14 7-14 7" fill="none" stroke="#91a6b0" stroke-width="2"/>
<text x="185" y="99" font-size="20">+y</text><text x="748" y="427" font-size="20">+x</text>
<path d="M200 185V308M200 332V508M200 532V565" stroke="#526875" stroke-width="6"/>
<path d="M680 114V551" stroke="#526875" stroke-width="5"/>
<text x="637" y="100" font-size="17">Screen</text>
<path d="M200 320H680M200 520H680" stroke="#91a6b0" stroke-width="1.8" stroke-dasharray="7 6"/>
<path d="M666 320V306H680M666 520V506H680" fill="none" stroke="#91a6b0" stroke-width="1.8"/>
<path d="M200 420 680 160" stroke="#526875" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M200 320 680 160" stroke="#086b72" stroke-width="3.5"/>
<path d="M200 520 680 160" stroke="#bd4b24" stroke-width="3.5"/>
<text transform="translate(425 231) rotate(-18.435)" font-size="22" fill="#086b72">r_A = AP</text>
<text transform="translate(420 277) rotate(-28.443)" font-size="20" fill="#526875">R = MP</text>
<text transform="translate(432 368) rotate(-36.870)" font-size="22" fill="#bd4b24">r_B = BP</text>
<path d="M255 420A55 55 0 0 0 248.36 393.80" fill="none" stroke="#526875" stroke-width="2"/>
<text x="264" y="409" font-size="21">θ</text>
<text x="437" y="448" font-size="16" fill="#526875">Central normal</text>
<g fill="#182e3c"><circle cx="200" cy="320" r="5"/><circle cx="200" cy="520" r="5"/><circle cx="200" cy="420" r="5"/><circle cx="680" cy="160" r="5"/><circle cx="680" cy="420" r="5"/></g>
<text x="28" y="303" font-size="20" fill="#086b72">A (0, d/2)</text>
<text x="28" y="555" font-size="20" fill="#bd4b24">B (0, −d/2)</text>
<text x="170" y="451" font-size="18">M</text><text x="213" y="451" font-size="17">(0, 0)</text>
<text x="696" y="151" font-size="20">P (L, y)</text>
<text x="696" y="451" font-size="18">O (L, 0)</text>
<text x="696" y="327" font-size="17">Q_A</text><text x="696" y="527" font-size="17">Q_B</text>
<path d="M120 320V520M113 320H127M113 520H127" stroke="#526875" stroke-width="2"/>
<text x="92" y="427" font-size="23">d</text>
<path d="M790 160V420M783 160H797M783 420H797" stroke="#526875" stroke-width="2"/>
<text x="807" y="297" font-size="23">y</text>
<path d="M200 588H680M200 581V595M680 581V595" stroke="#526875" stroke-width="2"/>
<text x="432" y="616" font-size="23">L</text>
<text x="28" y="653" font-size="17">AQ_A = BQ_B = L</text>
<text x="330" y="653" font-size="17">PQ_A = y − d/2; PQ_B = y + d/2</text>
<text x="28" y="679" font-size="14" fill="#526875">Shown with y &gt; d/2. In general the vertical leg lengths use absolute values.</text>
</g>
</svg>
