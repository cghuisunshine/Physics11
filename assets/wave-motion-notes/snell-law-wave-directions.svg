<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 320" width="700" height="640" role="img" aria-labelledby="title desc">
<title id="title">Snell’s law: labeled wave directions</title><desc id="desc">Orange arrows C to B and A to D indicate the incident and refracted directions. Blue AC and green BD are perpendicular wavefronts.</desc>
<defs><marker id="dir" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b45309"/></marker></defs>
<rect width="350" height="320" fill="white"/><rect x="2" y="2" width="346" height="158" fill="#eef6ff"/><rect x="2" y="160" width="346" height="158" fill="#e3f5ee"/>
<line x1="2" y1="160" x2="348" y2="160" stroke="#172b45" stroke-width="1.6"/>
<path d="M55 160 L165 50 L275 160 Z" fill="#3b82f6" fill-opacity=".06"/>
<path d="M55 160 L97.96875 247.21703688751126 L275 160 Z" fill="#16a34a" fill-opacity=".06"/>
<path d="M55 160 L165 50" stroke="#2563eb" stroke-width="2.5" fill="none"/><path d="M97.96875 247.21703688751126 L275 160" stroke="#15803d" stroke-width="2.5" fill="none"/>
<path d="M165 50 L275 160" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#dir)"/><path d="M55 160 L97.96875 247.21703688751126" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#dir)"/>
<path d="M157 58 L165 66 L173 58" fill="none" stroke="#172b45"/>
<path d="M93.54875 238.24703688751126 L102.51875 233.82703688751127 L106.93875 242.79703688751127" fill="none" stroke="#172b45"/>
<path d="M85 160 A30 30 0 0 0 76.21 138.79" stroke="#2563eb" stroke-width="1.8" fill="none"/><path d="M239 160 A36 36 0 0 0 242.68 175.87" stroke="#15803d" stroke-width="1.8" fill="none"/>
<g fill="#172b45" font-family="Arial,sans-serif" font-size="12"><text x="42" y="153">A</text><text x="280" y="155">B</text><text x="160" y="40">C</text><text x="93" y="265">D</text><text x="165" y="154" text-anchor="middle">L</text><text x="10" y="20">Medium 1 (faster)</text><text x="10" y="305">Medium 2 (slower)</text><text x="87" y="145" fill="#2563eb">θ₁</text><text x="220" y="182" fill="#15803d">θ₂</text><text x="64" y="92" transform="rotate(-45 64 92)" fill="#2563eb">Incident crest</text><text x="171" y="234" transform="rotate(-26.2 171 234)" fill="#15803d">Refracted crest</text><text x="220" y="60" fill="#b45309" font-weight="bold">Incident</text><text x="220" y="76" fill="#b45309" font-weight="bold">direction ↘</text><text x="236" y="108" fill="#b45309">v₁Δt</text><text x="14" y="207" fill="#b45309">v₂Δt</text><text x="120" y="275" fill="#b45309" font-weight="bold">Refracted direction ↘</text></g>
<g fill="#172b45"><circle cx="55" cy="160" r="3"/><circle cx="275" cy="160" r="3"/><circle cx="165" cy="50" r="3"/><circle cx="97.96875" cy="247.21703688751126" r="3"/></g></svg>